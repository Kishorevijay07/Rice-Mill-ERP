[project]
name = "rice-mill-erp-backend"
version = "0.1.0"
description = "Rice Mill ERP — FastAPI modular monolith backend"
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    # Pure-Python Postgres driver. An alternative to psycopg for local dev on
    # machines where the psycopg binary (libpq.dll) is blocked by an OS policy
    # such as Windows Smart App Control. Selected via DB_DRIVER=pg8000.
    "pg8000>=1.31,<2",
    "redis>=5.2,<6",
    "structlog>=24.4,<25",
    "python-multipart>=0.0.12,<0.1",
    "pwdlib[argon2]>=0.2.1,<0.3",
    "fpdf2>=2.8,<3",
    # Pure-Python QR generator (no Pillow/binary deps) for the "scan to download"
    # QR printed on invoices. Emits PNG that fpdf2 embeds natively.
    "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.28,<0.29",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["app", "tests"]

# Test functions and fixtures are conventionally left unannotated.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
